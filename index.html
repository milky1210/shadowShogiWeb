<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071018" />
    <title>影将棋 | Shadow Shogi</title>
    <meta
      name="description"
      content="相手の駒の影と動きから正体を読み、隠れた王を探す将棋ゲーム。ローカル・ネット・3段階のCPU対局に対応。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="影将棋 | Shadow Shogi" />
    <meta
      property="og:description"
      content="その一手が、正体を語る。匿名のネット対戦と3段階のCPU対局で遊べる、正体隠匿型の将棋ゲーム。"
    />
    <meta
      property="og:image"
      content="https://shadow-shogi.rays-dev.com/og.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="影将棋 | Shadow Shogi" />
    <meta
      name="twitter:description"
      content="その一手が、正体を語る。匿名のネット対戦と3段階のCPU対局で遊べる、正体隠匿型の将棋ゲーム。"
    />
    <meta
      name="twitter:image"
      content="https://shadow-shogi.rays-dev.com/og.jpg"
    />
    <link rel="icon" href="/favicon.svg" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #071018;
      }
      body {
        color: #f0eee5;
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
      }
      .launch-screen {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        box-sizing: border-box;
        padding: 32px;
        background:
          radial-gradient(circle at 50% 42%, #17303a 0, #0b1a21 32%, #071018 68%),
          #071018;
        text-align: center;
      }
      .launch-emblem {
        width: 58px;
        height: 66px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #e6c98d, #a8753d);
        clip-path: polygon(50% 0, 90% 21%, 96% 100%, 4% 100%, 10% 21%);
        color: #171d1c;
        font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
        font-size: 27px;
        font-weight: 800;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.35));
      }
      .launch-kicker {
        margin: 18px 0 4px;
        color: #c79d58;
        font-family: Georgia, serif;
        font-size: 9px;
        letter-spacing: 0.28em;
      }
      .launch-title {
        margin: 0;
        font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.18em;
      }
      .launch-progress {
        width: 116px;
        height: 2px;
        margin-top: 24px;
        overflow: hidden;
        background: rgba(199, 157, 88, 0.16);
      }
      .launch-progress::after {
        content: '';
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #d2aa66, transparent);
        animation: launch-progress 1.25s ease-in-out infinite;
      }
      .launch-status {
        margin: 10px 0 0;
        color: #71868b;
        font-size: 10px;
        letter-spacing: 0.12em;
      }
      @keyframes launch-progress {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-progress::after {
          animation: none;
          transform: translateX(70%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="launch-screen" role="status" aria-live="polite">
        <div class="launch-emblem" aria-hidden="true">影</div>
        <p class="launch-kicker">SHADOW SHOGI</p>
        <h1 class="launch-title">影将棋</h1>
        <div class="launch-progress" aria-hidden="true"></div>
        <p class="launch-status">盤面を準備しています</p>
      </main>
    </div>
    <noscript>影将棋を遊ぶにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
